<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8"/>
    <title>Microsoft OAuth 回调</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; background: #f5f5f5; }
        .container { text-align: center; padding: 40px; background: white; border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,0.1); max-width: 400px; }
        h2 { margin: 0 0 12px; }
        p { color: #666; margin: 8px 0; }
        .cta { color: #6366f1; text-decoration: none; }
        .btn { display: inline-block; margin-top: 16px; padding: 10px 24px; background: #6366f1; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 14px; }
        .btn:hover { background: #4f46e5; }
    </style>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const params = new URLSearchParams(window.location.search);
            const code = params.get("code");
            const state = params.get("state");

            if (!code) {
                document.body.innerHTML = `
                    <div class="container">
                        <h2>❌ 未检测到授权码</h2>
                        <a class="cta" href="https://mstodo.dpdns.org" target="_blank">访问 MS ToDo 官网</a>
                    </div>`;
                return;
            }

            // 解析 state 参数
            let redirectUrl = null;
            let extensionId = null;
            let region = null;
            if (state) {
                try {
                    const stateData = JSON.parse(decodeURIComponent(state));
                    redirectUrl = stateData.redirect || null;
                    extensionId = stateData.extensionId || null;
                    region = stateData.region || null;
                } catch (e) {
                    // state 不是 JSON，忽略
                }
            }

            // 🔑 方式1（优先）：重定向回扩展（Chrome 兼容）
            if (redirectUrl) {
                const separator = redirectUrl.includes('?') ? '&' : '?';
                const targetUrl = redirectUrl + separator + 'code=' + encodeURIComponent(code);

                document.body.innerHTML = `
                    <div class="container">
                        <h2>✅ 授权成功！</h2>
                        <p>正在返回插件...</p>
                    </div>`;

                // 尝试重定向
                window.location.href = targetUrl;

                // 800ms 后检查：如果重定向被阻止（Firefox），尝试其他方式
                setTimeout(() => {
                    // 🔑 方式2：chrome.runtime.sendMessage（Firefox 消息通信）
                    if (extensionId) {
                        try {
                            chrome.runtime.sendMessage(extensionId, {
                                type: "oauth_code",
                                code: code,
                                region: region
                            }, (response) => {
                                if (chrome.runtime.lastError) {
                                    console.warn("⚠️ runtime.sendMessage 失败:", chrome.runtime.lastError.message);
                                    showManualFallback(redirectUrl + '?code=' + encodeURIComponent(code));
                                } else {
                                    document.body.innerHTML = `
                                        <div class="container">
                                            <h2>✅ 授权成功！</h2>
                                            <p>已通知插件，正在登录...</p>
                                        </div>`;
                                    // 尝试关闭当前标签页
                                    setTimeout(() => { try { window.close(); } catch(e) {} }, 2000);
                                }
                            });
                            return;
                        } catch (e) {
                            console.warn("⚠️ chrome.runtime.sendMessage 异常:", e);
                        }
                    }

                    // 🔑 方式3：opener.postMessage（Chrome 旧流程兜底）
                    try {
                        if (window.opener && !window.opener.closed) {
                            window.opener.postMessage({type: "oauth_code", code}, "*");
                        }
                    } catch (e) {}

                    // 显示手动操作按钮
                    showManualFallback(targetUrl);
                }, 800);
                return;
            }

            // 没有 redirectUrl，使用 postMessage 兜底
            try {
                if (window.opener && !window.opener.closed) {
                    window.opener.postMessage({type: "oauth_code", code}, "*");
                }
            } catch (e) {}

            document.body.innerHTML = `
                <div class="container">
                    <h2>✅ 授权成功！</h2>
                    <p>正在通知插件，请稍候...</p>
                    <a class="cta" href="https://mstodo.dpdns.org" target="_blank">访问 MS ToDo 官网</a>
                </div>`;

            setTimeout(() => {
                try { window.close(); } catch(e) {}
            }, 4000);

            function showManualFallback(autoUrl) {
                document.body.innerHTML = `
                    <div class="container">
                        <h2>✅ 授权成功！</h2>
                        <p>正在尝试连接插件...</p>
                        <button class="btn" onclick="window.location.href='${autoUrl}'">
                            点击返回插件
                        </button>
                    </div>`;
            }
        });
    </script>
</head>
<body>
<h2>正在处理授权结果...</h2>
</body>
</html>
